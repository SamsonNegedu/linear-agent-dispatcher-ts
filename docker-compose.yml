services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    user: root
    volumes:
      - ./.data/dynamodb:/data
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8000 || exit 1']
      interval: 2s
      timeout: 2s
      retries: 15

  # Quick tunnel (no account). URL changes every run; scripts/dev-up.mjs reads it from the logs.
  tunnel:
    profiles: ['quick']
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://host.docker.internal:${RELAY_PORT:-3001}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Named tunnel (stable URL). Set CLOUDFLARE_TUNNEL_TOKEN and TUNNEL_HOSTNAME in the root .env;
  # in Cloudflare Zero Trust point that hostname's service at http://host.docker.internal:<relay-port>.
  tunnel-named:
    profiles: ['named']
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-unset}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
